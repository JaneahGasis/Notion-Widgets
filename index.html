<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task tabs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@500;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:var(--font),system-ui,sans-serif;background:transparent;color:var(--fg)}
main{max-width:560px;margin:auto}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:0 10px}
.tab{flex:none;max-width:170px;padding:11px 16px;border:0;border-radius:14px 14px 0 0;background:var(--tab);color:var(--tabfg);font:inherit;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tab[aria-selected=true]{background:var(--panel);color:var(--fg)}
.tab.done:not([aria-selected=true]){opacity:.75}
.plus{font-size:20px;padding:7px 16px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#panel{background:var(--panel);border-radius:22px;overflow:hidden;box-shadow:var(--sh)}
.hero{padding:28px 26px 32px;background:var(--hero);color:var(--herofg)}
.hero p{margin:0 0 6px;font-size:14px;opacity:.9}
.hero h2{margin:0;font-size:28px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.body{padding:24px 26px 26px}
.step{display:flex;gap:14px;align-items:center;padding:12px 14px;margin-bottom:12px;border-radius:18px;background:var(--stepbg);border:2px solid transparent;transition:border-color .2s}
.step:focus-within{border-color:var(--ac)}
.ico{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:var(--ico);box-shadow:0 3px 10px var(--icosh)}
.step label{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--mute)}
.step input{display:block;width:100%;margin:2px 0 0;padding:0;border:0;outline:0;background:none;font:inherit;font-size:18px;font-weight:600;color:var(--fg)}
.step input::placeholder{color:var(--mute);opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pick{border:0;padding:8px 13px;border-radius:999px;background:var(--pick);color:var(--pickfg);font:inherit;font-size:14px;cursor:pointer;transition:transform .15s}
.pick:hover{transform:translateY(-2px)}
button{font:inherit}
.go{display:block;width:100%;margin-top:24px;padding:15px;border:0;border-radius:16px;background:var(--btn);color:var(--btnfg);font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 8px 20px var(--btnsh);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.go.undo{background:var(--undo);color:var(--undofg);box-shadow:none}
.link{display:block;margin:14px auto 0;border:0;background:none;color:var(--mute);font-size:14px;text-decoration:underline;cursor:pointer}
.gift{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:var(--gift);border:2px dashed var(--giftbd)}
.gift.open{background:var(--giftopen);border:2px solid var(--giftopenbd)}
.gicon{font-size:46px;line-height:1}
.gift:not(.open) .gicon{animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,100%,30%{transform:rotate(0)}8%{transform:rotate(-9deg)}16%{transform:rotate(9deg)}24%{transform:rotate(-5deg)}}
.gift span{display:block;font-size:13px;font-weight:600;color:var(--giftspan)}
.gift.open span{color:var(--giftopenspan)}
.gift strong{display:block;margin-top:2px;font-size:21px;font-weight:700;overflow-wrap:anywhere}
.body h2{margin:0 0 14px;font-size:26px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.sub{margin:-6px 0 20px;color:var(--mute);font-size:14px}
.field{display:block;margin-bottom:14px;font-size:14px;font-weight:600;color:var(--mute)}
.field input{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--fbd);background:var(--fbg);border-radius:12px;font:inherit;font-size:15px;font-weight:400;color:var(--fg);outline:0}
.field input:focus{border-color:var(--ac)}
.body.plain{padding-top:30px}
.conf{position:fixed;left:50%;top:42%;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:9}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.3s;padding:10px 18px;border-radius:999px;background:var(--toast,var(--btn));color:var(--btnfg);font-size:15px;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.hero h2{font-family:var(--head),var(--font),serif;font-weight:var(--hw);letter-spacing:var(--ht);font-size:31px;line-height:1.12;text-wrap:balance}
.hero p{font-weight:600;letter-spacing:.02em}
.tab{font-size:14px;letter-spacing:.01em}
.step label,.field{font-size:13px;letter-spacing:.01em}
.step input{font-size:17px;font-weight:600}
.field input{font-size:16px}
.gift strong{font-family:var(--head),var(--font),serif;font-weight:var(--hw);letter-spacing:var(--ht);font-size:24px;line-height:1.2}
.gift.open strong{color:var(--giftopenfg,var(--fg))}
.go{font-size:16px;letter-spacing:.01em}
.hero{position:relative;overflow:hidden;padding:30px 26px 36px}
.hero::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;right:58px;bottom:-36px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero p,.hero h2{position:relative;z-index:1}
.hero p{display:inline-block;margin:0 0 12px;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.22);font-size:13px;opacity:1}
.hero h2{font-size:36px;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.18)}
:root{--font:'Nunito';--head:'DM Serif Display';--hw:400;--ht:0;--tab:#3b2342;--tabfg:#d9a6c6;--panel:#241527;--fg:#fbe9f3;--mute:#c79ab8;--ac:#ff7ab8;--hero:linear-gradient(135deg,#ff5fa2,#c13fa0 55%,#6b2c91);--herofg:#fff;--stepbg:#301b34;--ico:#1c0f1f;--icosh:rgba(0,0,0,.4);--pick:#4a2142;--pickfg:#ffc6e0;--btn:linear-gradient(135deg,#db2777,#a21caf);--btnfg:#fff;--btnsh:rgba(219,39,119,.4);--undo:#3b2342;--undofg:#ffb3d6;--gift:repeating-linear-gradient(135deg,#2c1a31 0 12px,#33203a 12px 24px);--giftbd:#8a4a7c;--giftopen:linear-gradient(135deg,#f9d3b8,#f08fab);--giftopenbd:#ffd0e2;--giftspan:#c79ab8;--giftopenspan:#7a2a4e;--giftopenfg:#3a1230;--fbd:#5a2f58;--fbg:#1c0f1f;--sh:0 14px 40px rgba(20,5,25,.55)}
#panel{background:radial-gradient(circle at 100% 0,rgba(255,122,184,.16),#0000 50%),var(--panel)}
</style></head>
<body data-k="d" data-conf="#ff7ab8,#ffd1e8,#f6c1a0,#c084fc,#fff" data-gift="🔮,✨">
<main>
<div id="tabs" role="tablist"></div>
<section id="panel"></section>
</main>
<div id="toast" role="status"></div>
<script>

const K='taskreward-tabs-'+document.body.dataset.k;let items=[],sel='new';
try{items=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
if(items.length)sel=items[0].id;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(items))}catch(e){}};
const G=(document.body.dataset.gift||'🎁,🎉').split(',');const PICKS=window.PICKS||[['☕','Iced coffee'],['🍫','Sweet treat'],['🎬','Movie night'],['🛍️','Shopping trip'],['😴','Guilt-free nap'],['🎮','Gaming hour']];
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const cols=(document.body.dataset.conf||'#ffd23f,#ff6b9d,#4cc9f0').split(',');
 for(let n=0;n<56;n++){
  const p=document.createElement('i');p.className='conf';p.style.background=cols[n%cols.length];
  document.body.append(p);
  const a=Math.random()*Math.PI*2,d=90+Math.random()*200;
  p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
   {transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+170)+'px) rotate('+Math.random()*720+'deg)',opacity:0}],
   {duration:1100+Math.random()*800,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove();
 }}
function render(){
 $('tabs').innerHTML=items.map(i=>'<button role="tab" aria-selected="'+(sel===i.id)+'" class="tab'+(i.done?' done':'')+'" data-id="'+i.id+'">'+(i.done?'✓ ':'')+esc(i.task)+'</button>').join('')
  +'<button role="tab" aria-selected="'+(sel==='new')+'" class="tab plus" data-id="new" aria-label="New task">+</button>';
 const it=items.find(i=>i.id===sel);
 $('panel').innerHTML=it
  ?'<div class="hero"><p>'+(it.done?'Nicely done':'Your task')+'</p><h2>'+esc(it.task)+'</h2></div><div class="body">'
   +'<div class="gift'+(it.done?' open':'')+'"><div class="gicon">'+(it.done?G[1]:G[0])+'</div><div><span>'+(it.done?'Reward unlocked':'Complete the task to unlock')+'</span><strong>'+esc(it.reward)+'</strong></div></div>'
   +'<button type="button" class="go'+(it.done?' undo':'')+'" data-act="toggle">'+(it.done?'Mark as not done':'Complete task')+'</button>'
   +'<button type="button" class="link" data-act="del">Delete task</button></div>'
  :'<div class="hero"><p>New task</p><h2>What are you going for?</h2></div><div class="body">'
   +'<label class="field">Task<input id="task" maxlength="120" placeholder="e.g. Finish the report"></label>'
   +'<label class="field">Reward<input id="reward" maxlength="80" placeholder="e.g. Iced coffee"></label>'
   +'<button type="button" class="go" data-act="add">Add task</button></div>';
}
function add(){
 const t=$('task').value.trim(),r=$('reward').value.trim();
 if(!t){$('task').focus();return}
 if(!r){$('reward').focus();return}
 const id=Date.now().toString(36);
 items.push({id,task:t,reward:r,done:false});sel=id;save();render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.id){sel=b.dataset.id;render();return}
 if(b.dataset.pick){$('reward').value=b.dataset.pick;$('reward').focus();return}
 const it=items.find(i=>i.id===sel),a=b.dataset.act;
 if(a==='add')add();
 else if(a==='toggle'&&it){it.done=!it.done;save();render();if(it.done){confetti();toast('Reward unlocked: '+it.reward)}}
 else if(a==='del'&&it){items=items.filter(i=>i!==it);sel=items.length?items[0].id:'new';save();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();add()}});
render();
</script>
</body></html>
